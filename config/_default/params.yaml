# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    # ชื่อที่จะแสดงในแถบเมนูและหัวเว็บ
    name: "Nopnathon Navachai"
    organization: "มหาวิทยาลัยหอการค้าไทย (UTCC)"
    type: person
    # คำอธิบายใต้ชื่อ (Tagline)
    tagline: "Assistant Professor & Digital Marketing Researcher"
    # คำอธิบายสำหรับ Google Search
    description: "อาจารย์และนักวิจัยผู้เชี่ยวชาญด้านการตลาดดิจิทัลและ Neuromarketing คณะบริหารธุรกิจ มหาวิทยาลัยหอการค้าไทย"
    social:
      twitter: ""

  # ────────────────────────────────────────────────────────────────────────────
  # THEME
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: system
    pack: "default"
    colors:
      primary: "indigo"
      secondary: ""
      neutral: ""
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    pack: "academic"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    radius: "md"
    spacing: "spacious"
    avatar_shape: circle

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: true
    language_switcher: true
    # ปุ่ม Call-to-action (CTA) สำหรับรับงานที่ปรึกษา
    cta:
      enable: true
      text: "Contact for Consulting"
      url: "https://nopnathon-cloud.github.io/#contact"

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal
    language_switcher: true
    text: ""

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    notice: "© {year} {name}. All Rights Reserved."
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  # ────────────────────────────────────────────────────────────────────────────
  # SEO
  # ────────────────────────────────────────────────────────────────────────────
  seo:
    # ชื่อที่จะปรากฏบนหน้า Tab ของ Browser
    title: "Nopnathon Navachai | Digital Marketing & Neuromarketing Researcher"
    location:
      address:
        street: ""
        city: ""
        region: ""
        postal_code: ""
        country: ""
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: "Guidance for AI crawlers."
      contact: ""
